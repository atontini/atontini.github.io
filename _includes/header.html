<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">at<span>.</span></span><span>Andrea Tontini</span></a>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if item.title == 'Blog' and page.layout == 'blog' %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <div class="theme-control" hidden>
      <label for="theme">Theme</label>
      <select id="theme" name="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </div>
</header>
