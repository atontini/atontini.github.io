<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <script>
    // Apply a saved preference before paint; CSS handles the system default.
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) { /* Storage can be unavailable in private contexts. */ }
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/site.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} — Blog" href="{{ '/atom.xml' | absolute_url }}">
  <script src="{{ '/public/js/script.js' | relative_url }}" defer></script>
</head>
